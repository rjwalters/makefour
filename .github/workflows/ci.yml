name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        # Coverage targets functions/. Run the full suite, including timing checks,
        # without instrumentation in the preceding step.
        run: npm test -- --coverage functions/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    # E2E tests need maintenance - make non-blocking for now
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Initialize local D1 database
        run: npm run db:local

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `wrangler pages dev` always opens a remote session for the [ai]
      # binding, which needs Cloudflare credentials. Redirect it to the
      # local-only config (no AI binding) for this runner.
      - name: Select local-only Wrangler config
        run: |
          mkdir -p .wrangler/deploy
          echo '{"configPath":"../../wrangler.e2e.toml"}' > .wrangler/deploy/config.json

      - name: Run E2E tests
        run: npm run test:e2e:chromium
        timeout-minutes: 15
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
